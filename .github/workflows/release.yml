name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-rc1, a pre-release) runs the test suite,
# builds the binaries and Debian packages, and attaches them with their
# checksums to a DRAFT GitHub release for that tag. The macOS binaries built
# here are not Developer ID signed, so on a Mac that holds the certificate,
#   NOTARY_PROFILE=<profile> scripts/sign-macos-release.sh vX.Y.Z
# replaces the macOS tarballs with signed, notarized and stapled disk images
# and publishes the draft (doc/RELEASING.md). Running the workflow by hand
# builds the same files from the chosen branch and keeps them as a workflow
# artifact without making a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}" goarch="${target#*/}"
            name="ricochet_${VERSION}_${goos}_${goarch}"
            exe=ricochet; [ "$goos" = windows ] && exe=ricochet.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$name/$exe" ./cmd/ricochet
            cp LICENSE README.md config.example.yaml schema.sql "build/$name/"
            if [ "$goos" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done

      - name: Debian packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            VERSION="$VERSION" ARCH="$arch" OUT_DIR=dist scripts/package-deb.sh
          done

      - name: Check the packages
        run: |
          deb="$(ls dist/ricochet-server_*_amd64.deb)"
          dpkg-deb --contents "$deb"
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./opt/ricochet/ricochet_server > ricochet_server
          chmod +x ricochet_server
          ./ricochet_server --version

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ricochet-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # a draft until scripts/sign-macos-release.sh has put the signed,
      # notarized and stapled disk images in place of the macOS tarballs
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ricochet Server $TAG" \
            --draft \
            --generate-notes \
            --verify-tag \
            $prerelease
