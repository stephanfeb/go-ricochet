name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ricochet
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: ricochet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ricochet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: README examples compile from an external module
        run: ./scripts/check-readme-examples.sh

      - name: Load schema
        env:
          PGPASSWORD: testpw
        run: psql -h localhost -U ricochet -d ricochet_test -v ON_ERROR_STOP=1 -f schema.sql

      - name: Test
        env:
          RICOCHET_TEST_POSTGRES_DSN: postgres://ricochet:testpw@localhost:5432/ricochet_test?sslmode=disable
        run: go test -count=1 ./...
