# Ricochet Store-and-Forward Server Configuration (Go)
#
# Place this file at /etc/ricochet/config.yaml and it will be loaded
# automatically at startup. CLI flags override values from this file.
#
# Precedence: defaults → config file → CLI flags

# Server identity and network configuration
server:
  port: 55223
  region: us-east-1

  # Identity configuration (optional)
  # If not specified, checks RICOCHET_SEED_HEX environment variable,
  # then falls back to auto-generating identity in data_directory
  # identity_file: /etc/ricochet/keys/peer_identity.key

  # Listen addresses (multiaddrs)
  # NOTE: On Linux, binding both IPv6 [::] and IPv4 0.0.0.0 on the same port
  # fails because the IPv6 dual-stack socket claims both families by default.
  listen_addresses:
    - /ip4/0.0.0.0/udp/55223/udx

  # External addresses to advertise via Identify.
  # IMPORTANT: Set this to the server's public IP so remote clients can
  # reconnect after a connection drop. Without this, clients only see
  # private IPs and lose the server's address from their peerstore.
  external_addresses:
    - /ip4/YOUR_PUBLIC_IP/udp/55223/udx

  # Bootstrap peers for DHT (optional)
  bootstrap_peers: []

# Storage configuration
storage:
  data_directory: /var/lib/ricochet/sf_storage
  max_storage_gb: 50
  retention_days: 30
  max_messages_per_mailbox: 1000
  max_mailboxes: 100000

# PostgreSQL configuration
database:
  host: localhost
  port: 5432
  name: ricochet
  username: ricochet
  # password: set via DB_PASSWORD in /etc/ricochet/env
  sslmode: disable
  pool_size: 10

# Performance configuration
performance:
  max_concurrent_connections: 10000
  connection_timeout_sec: 30
  message_timeout_sec: 10
  worker_threads: 4

# Service intervals
#
# cleanup_min also paces the capacity sample: the aggregate that answers
# queryCapacity and feeds the ricochet_mailboxes / ricochet_mailbox_depth /
# ricochet_mailboxes_near_capacity series scans every mailbox, so it is taken
# on this tick rather than per request. The first one runs at startup. The
# sample's age is published as ricochet_stats_age_seconds and returned as
# sampledAt, so a figure that has gone stale says so.
intervals:
  service_announcement_min: 60
  health_check_min: 5
  cleanup_min: 5
  presence_check_sec: 30
  presence_heartbeat_sec: 60
  presence_timeout_sec: 120

# Feature flags
features:
  enable_forwarding: false
  enable_push_delivery: true
  enable_presence_monitoring: true
  enable_presence_broadcast: true
  enable_metrics: true
  enable_authentication: false
  enable_relay: true
  enable_relay_service: true
  enable_autonat: true

# Operator HTTP surface
#
# Liveness, readiness and (when features.enable_metrics is on) Prometheus
# metrics, served on a plain HTTP listener separate from the libp2p protocols.
# This is what lets a load balancer or orchestrator see the instance: without
# it there is no health check, and an instance that cannot serve looks the same
# as one that can.
#
# /healthz  liveness. Never touches the database, so a database outage does not
#           get the process restarted for a fault a restart cannot fix.
# /readyz   readiness. Pings PostgreSQL and returns 503 when it is unreachable
#           or when the server is shutting down, which is how an instance
#           drains. Saturation is NOT unreadiness -- a busy instance is
#           working, and withdrawing it moves its load onto the busiest peers.
#           The body also carries admission and connection-pool figures.
# /metrics  Prometheus, gated on features.enable_metrics. Publishes request
#           counts and latency labelled by protocol, operation and outcome --
#           where `rate_limited` (a peer over its budget) and `overloaded` (the
#           server shedding) are separate, because they call for opposite
#           responses -- alongside admission, connection-pool and buffer-pool
#           figures. Peer IDs never appear in a label; with thousands of mobile
#           clients that would be unbounded cardinality.
#
# Bound to loopback because readiness details, metrics and profiles all
# disclose internal state. Reach it from off-host with an SSH tunnel, or set
# bind explicitly if the network is already trusted.
ops:
  enabled: true
  bind: 127.0.0.1
  port: 9090

  # Mounted on this listener:
  #   /healthz                    liveness; touches no dependency
  #   /readyz                     readiness; 503 when a dependency is down or draining
  #   /metrics                    Prometheus exposition (requires enable_metrics)
  #   /ops/mailboxes/top?n=20     fullest mailboxes across every owner
  #                               (add sort=count to order by size instead)
  #   /ops/mailboxes?owner=<id>   one peer's mailboxes, without being that peer
  #   /ops/storage                per-owner totals plus the sampled server-wide figures
  #   /ops/limits                 the effective limits this server actually parsed
  #
  # The /ops/* views name peer IDs and report what every owner is storing. That
  # is the point of them, and it is why this listener binds to loopback: moving
  # it off 127.0.0.1 exposes one tenant's usage to anyone who can reach the
  # port. Front it with something that authenticates if it has to travel.

  # Mounts /debug/pprof. Off by default: the profiles include goroutine stacks
  # and heap contents. Turn it on to diagnose, then turn it off.
  enable_pprof: false

  # How long /readyz waits on its checks. A probe that hangs is worse than one
  # that fails.
  readiness_timeout: 2s

  # How long shutdown waits for in-flight ops requests.
  shutdown_timeout: 5s

  # How long shutdown keeps serving after /readyz starts reporting unready.
  # Behind a load balancer, set this to a couple of probe intervals so the
  # instance is removed from rotation before it stops answering; without it the
  # instance disappears in the same instant it announces its withdrawal, and
  # the load balancer learns about the shutdown through failed requests.
  # Zero (the default) skips the wait, which is right when nothing is probing.
  drain_delay: 0s

# Admission control
#
# This is what governs throughput. It bounds how much work is in flight at
# once rather than how many requests a client may make per minute, so there is
# no ceiling in documents or requests per second to outgrow: work is admitted
# as fast as it can be completed. Throughput rises with the hardware and falls
# on its own when the database slows.
#
# It is also self-weighting. A batch write holds its slot for as long as it
# takes, so expensive work costs more capacity than cheap work without anyone
# having to maintain a cost model.
#
# A request that cannot be admitted within `acquire_timeout` is shed with a
# 503. That is a signal to add capacity -- a database connection, a replica, an
# instance -- not a verdict on the client.
admission_control:
  enabled: true

  # Concurrent requests server-wide. Omit or set 0 to derive it from
  # database.pool_size, which is the resource it protects.
  max_in_flight: 0

  # Concurrent requests from any single peer. This is what stops one client
  # occupying every slot, and it is why per-peer rate limiting can stay off.
  # Set 0 to remove the per-peer bound.
  max_in_flight_per_peer: 64

  # How long a request waits for a slot before being shed. Waiting is normal
  # and is how a fast client is paced to the database's actual speed.
  acquire_timeout: 5s

# Rate limiting (optional, off by default)
#
# Per-peer rate limits are NOT the throughput mechanism -- admission control
# above is. A rate limit is a constant somebody guessed: set it low and it caps
# a well-behaved client long before the hardware is busy; set it high and it
# protects nothing. It is also the wrong tool for overload, since a saturated
# server needs to shed whatever is arriving, not whatever a peer's budget says.
#
# They are here for the cases a capacity bound does not cover: per-tenant
# billing caps, untrusted peers, or containing a client known to be looping.
#
# Every limit is per peer. Each bucket has a sustained `rate` replenished over
# `window`, plus a `burst` a peer may accumulate while idle and spend at once.
# A `rate` of -1 disables the bucket, which is the default for all of them.
# A protocol name that is not recognised is a startup error rather than a
# silent no-op.
#
# When enabled, limits are counted per request: one BATCH_PUT costs the same as
# one PUT regardless of how many documents it carries.
#
# rate_limiting:
#   window: 1m
#   protocols:
#     msa:       { requests: { rate: 6000, burst: 12000 } }   # message submission
#     msa_batch: { requests: { rate: 600,  burst: 1200 } }    # batch submission, <=100 messages each
#     maa:       { requests: { rate: 6000, burst: 12000 } }   # message access
#     mma:       { requests: { rate: 600,  burst: 1200 } }    # mailbox administration
#     sda:                                                    # documents
#       read:  { rate: 6000, burst: 12000 }
#       write: { rate: 6000, burst: 12000 }
#     sfa:                                                    # feeds
#       read:  { rate: 6000, burst: 12000 }
#       write: { rate: 6000, burst: 12000 }
#     sca:                                                    # collections
#       read:  { rate: 6000, burst: 12000 }
#       write: { rate: 6000, burst: 12000 }
#     mta:       { requests: { rate: 60000, burst: 120000 } } # routing backstop, charged per message
#
# Legacy keys, still honoured. `window_minutes` is an alias for `window`;
# `max_requests_per_window` only ever fed the MTA backstop and still only does.
#
#   window_minutes: 1
#   max_requests_per_window: 60000

# Logging
logging:
  level: INFO
