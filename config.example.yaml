# Ricochet Store-and-Forward Server Configuration (Go)
#
# Place this file at /etc/ricochet/config.yaml and it will be loaded
# automatically at startup. CLI flags override values from this file.
#
# Precedence: defaults → config file → CLI flags

# Server identity and network configuration
server:
  port: 55223
  region: us-east-1

  # Identity configuration (optional)
  # If not specified, checks RICOCHET_SEED_HEX environment variable,
  # then falls back to auto-generating identity in data_directory
  # identity_file: /etc/ricochet/keys/peer_identity.key

  # Listen addresses (multiaddrs)
  # NOTE: On Linux, binding both IPv6 [::] and IPv4 0.0.0.0 on the same port
  # fails because the IPv6 dual-stack socket claims both families by default.
  listen_addresses:
    - /ip4/0.0.0.0/udp/55223/udx

  # External addresses to advertise via Identify.
  # IMPORTANT: Set this to the server's public IP so remote clients can
  # reconnect after a connection drop. Without this, clients only see
  # private IPs and lose the server's address from their peerstore.
  external_addresses:
    - /ip4/YOUR_PUBLIC_IP/udp/55223/udx

  # Bootstrap peers for DHT (optional)
  bootstrap_peers: []

# Storage configuration
storage:
  data_directory: /var/lib/ricochet/sf_storage
  max_storage_gb: 50
  retention_days: 30
  max_messages_per_mailbox: 1000
  max_mailboxes: 100000

# PostgreSQL configuration
database:
  host: localhost
  port: 5432
  name: ricochet
  username: ricochet
  # password: set via DB_PASSWORD in /etc/ricochet/env
  sslmode: disable
  pool_size: 10

# Performance configuration
performance:
  max_concurrent_connections: 10000
  connection_timeout_sec: 30
  message_timeout_sec: 10
  worker_threads: 4

# Service intervals
intervals:
  service_announcement_min: 60
  health_check_min: 5
  cleanup_min: 5
  presence_check_sec: 30
  presence_heartbeat_sec: 60
  presence_timeout_sec: 120

# Feature flags
features:
  enable_forwarding: false
  enable_push_delivery: true
  enable_presence_monitoring: true
  enable_presence_broadcast: true
  enable_metrics: true
  enable_authentication: false
  enable_relay: true
  enable_relay_service: true
  enable_autonat: true

# Rate limiting
#
# Every limit is per peer. Each bucket has a sustained `rate` replenished over
# `window`, plus a `burst` a peer may accumulate while idle and spend at once.
# Setting `burst` above `rate` lets a client with a backlog catch up without
# raising its sustained throughput; setting it below paces the client instead.
#
# Anything omitted keeps its built-in default, shown below. A protocol name
# that is not recognised is a startup error rather than a silent no-op.
# Set a rate to -1 to disable that bucket entirely.
#
# Limits are counted per request: one BATCH_PUT costs the same as one PUT
# regardless of how many documents it carries. The batch operations cap their
# own size, so this is bounded, but it does mean a client that batches gets
# far more throughput than one that does not.
rate_limiting:
  window: 1m

  protocols:
    # Message submission (/sf-network/submit/1.0.0)
    msa:
      requests: { rate: 100, burst: 200 }

    # Batch message submission (/sf-network/submit/batch/1.0.0),
    # up to 100 messages per request
    msa_batch:
      requests: { rate: 60, burst: 120 }

    # Message access (/sf-network/access/1.0.0). Retrieval is paged, so
    # walking a large mailbox legitimately costs many requests.
    maa:
      requests: { rate: 300, burst: 600 }

    # Mailbox administration (/sf-network/admin/1.0.0)
    mma:
      requests: { rate: 50, burst: 100 }

    # Documents (/ricochet/store/doc/1.0.0). BATCH_PUT carries up to 100
    # documents, so a client with a backlog should batch rather than ask for
    # a higher write rate.
    sda:
      read:  { rate: 300, burst: 600 }
      write: { rate: 60, burst: 120 }

    # Feeds (/ricochet/store/feed/1.0.0)
    sfa:
      read:  { rate: 300, burst: 600 }
      write: { rate: 60, burst: 120 }

    # Collections (/ricochet/store/collection/1.0.0)
    sca:
      read:  { rate: 300, burst: 600 }
      write: { rate: 60, burst: 120 }

    # Routing backstop, charged once per message. A batch submission costs
    # one request at the MSA edge but one unit here per message it carries,
    # so this sits well above the protocol limits and is not the binding
    # constraint under normal load.
    mta:
      requests: { rate: 6000, burst: 12000 }

  # Legacy keys, still honoured for existing deployments. `window_minutes` is
  # an alias for `window`; `max_requests_per_window` only ever fed the MTA
  # backstop and still only does, so it will not raise a protocol limit.
  # Prefer the per-protocol entries above.
  #
  # window_minutes: 1
  # max_requests_per_window: 6000

# Logging
logging:
  level: INFO
