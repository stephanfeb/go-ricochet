# Ricochet Store-and-Forward Server Configuration (Go)
#
# Place this file at /etc/ricochet/config.yaml and it will be loaded
# automatically at startup. CLI flags override values from this file.
#
# Precedence: defaults → config file → CLI flags

# Server identity and network configuration
server:
  port: 55223
  region: us-east-1

  # Identity configuration (optional)
  # If not specified, checks RICOCHET_SEED_HEX environment variable,
  # then falls back to auto-generating identity in data_directory
  # identity_file: /etc/ricochet/keys/peer_identity.key

  # Listen addresses (multiaddrs)
  # NOTE: On Linux, binding both IPv6 [::] and IPv4 0.0.0.0 on the same port
  # fails because the IPv6 dual-stack socket claims both families by default.
  listen_addresses:
    - /ip4/0.0.0.0/udp/55223/udx

  # External addresses to advertise via Identify.
  # IMPORTANT: Set this to the server's public IP so remote clients can
  # reconnect after a connection drop. Without this, clients only see
  # private IPs and lose the server's address from their peerstore.
  # The package sets this from EXTERNAL_IP in /etc/ricochet/env (run.sh passes
  # --external-addrs, which overrides this file); set it here for a manual run.
  # external_addresses:
  #   - /ip4/203.0.113.10/udp/55223/udx

  # Bootstrap peers for DHT (optional)
  bootstrap_peers: []

# Storage configuration
#
# Every value below is the built-in default except data_directory and
# max_storage_gb, which are deployment choices; the default of each is noted.
storage:
  data_directory: /var/lib/ricochet/sf_storage   # default: ./sf_storage
  max_storage_gb: 50                             # default: 10

  # Mailbox defaults.
  #
  # These are applied when a mailbox is created — by an explicit createMailbox,
  # or by the first message delivered to an address that has none. Both paths
  # read these settings; until 2cdc173 the delivery path used hardcoded
  # literals and ignored them, so a lowered cap appeared to do nothing.
  #
  # An existing mailbox keeps the settings it was created with, so changing
  # these affects newly created mailboxes only.
  #
  # A mailbox at max_messages_per_mailbox rejects further deliveries with a
  # 507, which clients are told not to retry on a timer — only the owner can
  # clear it. Watch ricochet_mailboxes_near_capacity, or ask
  # /ops/mailboxes/top?n=20 which mailboxes are closest.
  #
  # retention_days is enforced as "delete anything older than N days", so it
  # must never reach zero: a retention shorter than one day is rounded up to
  # one rather than truncated, which would delete every message on the next
  # sweep. Zero or omitted means "use the default", not "keep nothing".
  retention_days: 30                 # default: 30
  max_messages_per_mailbox: 1000     # default: 1000

  # Mailbox quotas, both enforced: a delivery or create that would exceed
  # one is refused with a 507. max_mailboxes_per_owner matters most — a
  # sender names the folder it delivers into, and the folder is created if
  # missing, so this is what stops one peer giving another an unbounded
  # number of them.
  max_mailboxes: 100000              # default: 100000, server-wide
  max_mailboxes_per_owner: 100       # default: 100

  # Loaded mailboxes the delivery path keeps in memory. A memory bound, not
  # a rate: a miss costs one indexed SELECT and the least recently used
  # entry makes room. Size it to the working set of active mailboxes.
  mailbox_cache_size: 10000          # default: 10000

  # Entries one feed may hold. A feed's own max_entries is a rolling window
  # its owner chooses; this is the ceiling under it, and it is what bounds a
  # collaborative feed that anyone may append to.
  max_entries_per_feed: 10000        # default: 10000

  # max_storage_gb is enforced as well as reported: once the database on
  # disk reaches it, message submission and document, feed and collection
  # writes are refused with a 507 until space is freed. The check uses the
  # periodic capacity sample, so a burst can run past the budget by up to
  # one cleanup interval's worth of writes.

  # The fill fraction at which a mailbox counts as "near capacity". It drives
  # the ricochet_mailboxes_near_capacity gauge and the figure /ops/storage
  # returns, so it is the threshold you alert on: how much warning you want
  # before a mailbox starts rejecting depends on how quickly you can act on it.
  # Must be between 0 and 1; zero means the default.
  near_capacity_ratio: 0.9           # default: 0.9

# PostgreSQL configuration
database:
  host: localhost
  port: 5432
  name: ricochet
  username: ricochet
  # password: set DB_PASSWORD in /etc/ricochet/env (the package install) or
  # export RICOCHET_PG_PASSWORD. Both keep it off the command line.
  # TLS to PostgreSQL. "require" is the default; "disable" only for a database
  # on the same host or a private network you trust.
  sslmode: require
  pool_size: 10

# Performance configuration
performance:
  # Hard cap on open peer connections, enforced by the libp2p resource
  # manager. Idle peers are trimmed once the count passes 90% of it.
  max_concurrent_connections: 10000
  # Cap on connections from any one source address (an IPv4 address or an
  # IPv6 /56). 0 is no cap, and is the default: phones behind a carrier NAT
  # and desks behind an office gateway share an address, and a cap turns the
  # ones past it away. Set it only where addresses are known to be one
  # client each. A peer identity is free to mint, so this is the only limit
  # tied to something a client cannot rotate.
  max_connections_per_ip: 0
  # How long a request or response may stall — no bytes moving — before the
  # stream is dropped. Refreshed as data arrives, so it does not limit how
  # long a large transfer may take.
  connection_timeout_sec: 30
  # Deadline for the work a request does once it has been read: storage
  # calls and the handler. A database that stops answering releases the
  # request at this point instead of holding it for the stream's whole life.
  message_timeout_sec: 10
  # Push notifications in flight at once. Each is a presence check and a
  # stream to a client that may be slow or gone; a burst of deliveries past
  # this many drops the surplus notifications, and clients poll regardless.
  worker_threads: 4

# Service intervals
#
# cleanup_min also paces the capacity sample: the aggregate that answers
# queryCapacity and feeds the ricochet_mailboxes / ricochet_mailbox_depth /
# ricochet_mailboxes_near_capacity series scans every mailbox, so it is taken
# on this tick rather than per request. The first one runs at startup. The
# sample's age is published as ricochet_stats_age_seconds and returned as
# sampledAt, so a figure that has gone stale says so.
intervals:
  service_announcement_min: 60
  health_check_min: 5
  cleanup_min: 5
  # presence_check_sec: how often the presence service reconciles its online
  # set with the network's live connections. A peer is online for as long as
  # it is connected; this sweep only repairs a missed connect or disconnect.
  presence_check_sec: 30
  # presence_heartbeat_sec: how often the full online set is published on the
  # presence topic, in pages of at most 4096 peer IDs.
  presence_heartbeat_sec: 60
  # presence_timeout_sec: the TTL advertised on an Online event, i.e. how long
  # a subscriber may trust it without a heartbeat. It never disconnects anyone.
  presence_timeout_sec: 120

# Feature flags
#
# All of them are listed with their defaults. A flag you omit keeps the
# preset's value; a flag you set, to true or false, is applied as written.
features:
  # Accept mail submitted on another sender's behalf by a peer listed in
  # security.trusted_peers. Off, a submission whose sender is not the peer
  # on the connection is refused.
  enable_forwarding: false
  enable_push_delivery: true
  enable_presence_monitoring: true
  enable_presence_broadcast: true
  enable_metrics: true              # gates /metrics on the ops listener
  # Only peers listed in security.trusted_peers may connect. On with an
  # empty list is a startup error, since it would refuse everyone.
  enable_authentication: false
  enable_relay: true
  enable_relay_service: true
  enable_auto_relay: false          # use discovered public relays for our own reachability
  enable_hole_punching: false       # DCUtR; needs relay to be reachable first
  enable_autonat: true

# Operator HTTP surface
#
# Liveness, readiness and (when features.enable_metrics is on) Prometheus
# metrics, served on a plain HTTP listener separate from the libp2p protocols.
# This is what lets a load balancer or orchestrator see the instance: without
# it there is no health check, and an instance that cannot serve looks the same
# as one that can.
#
# /healthz  liveness. Never touches the database, so a database outage does not
#           get the process restarted for a fault a restart cannot fix.
# /readyz   readiness. Pings PostgreSQL and returns 503 when it is unreachable
#           or when the server is shutting down, which is how an instance
#           drains. Saturation is NOT unreadiness -- a busy instance is
#           working, and withdrawing it moves its load onto the busiest peers.
#           The body also carries admission and connection-pool figures.
# /metrics  Prometheus, gated on features.enable_metrics. Publishes request
#           counts and latency labelled by protocol, operation and outcome --
#           where `rate_limited` (a peer over its budget) and `overloaded` (the
#           server shedding) are separate, because they call for opposite
#           responses -- alongside admission, connection-pool and buffer-pool
#           figures. Peer IDs never appear in a label; with thousands of mobile
#           clients that would be unbounded cardinality.
#
# Bound to loopback because readiness details, metrics and profiles all
# disclose internal state. Reach it from off-host with an SSH tunnel, or set
# bind explicitly if the network is already trusted.
ops:
  enabled: true
  bind: 127.0.0.1
  port: 9090

  # Mounted on this listener:
  #   /healthz                    liveness; touches no dependency
  #   /readyz                     readiness; 503 when a dependency is down or draining
  #   /metrics                    Prometheus exposition (requires enable_metrics)
  #   /ops/mailboxes/top?n=20     fullest mailboxes across every owner
  #                               (add sort=count to order by size instead)
  #   /ops/mailboxes?owner=<id>   one peer's mailboxes, without being that peer
  #   /ops/storage                per-owner totals plus the sampled server-wide figures
  #   /ops/limits                 the effective limits this server actually parsed
  #
  # The /ops/* views name peer IDs and report what every owner is storing. That
  # is the point of them, and it is why this listener binds to loopback: moving
  # it off 127.0.0.1 exposes one tenant's usage to anyone who can reach the
  # port. Front it with something that authenticates if it has to travel.

  # Mounts /debug/pprof. Off by default: the profiles include goroutine stacks
  # and heap contents. Turn it on to diagnose, then turn it off.
  enable_pprof: false

  # How long /readyz waits on its checks. A probe that hangs is worse than one
  # that fails.
  readiness_timeout: 2s

  # How long an /ops/* query may run. Those endpoints scan every mailbox, and
  # how long that takes is a property of the database rather than something a
  # constant can know — raise it on a large server, but note that an operator
  # surface which can be wedged by its own diagnostic query is worse than one
  # that admits it timed out.
  query_timeout: 10s

  # How long shutdown waits for requests already in flight, on the protocol
  # handlers and the ops surface alike, before closing storage under whatever
  # is left. New requests get a 503 from the moment the wait begins.
  shutdown_timeout: 5s

  # How long shutdown keeps serving after /readyz starts reporting unready.
  # Behind a load balancer, set this to a couple of probe intervals so the
  # instance is removed from rotation before it stops answering; without it the
  # instance disappears in the same instant it announces its withdrawal, and
  # the load balancer learns about the shutdown through failed requests.
  # Zero (the default) skips the wait, which is right when nothing is probing.
  drain_delay: 0s

# Circuit relay v2 service limits
#
# Only consulted when features.enable_relay_service is on. Every value is
# omitted below because a zero means "use the go-libp2p default", which is the
# right choice unless this server is carrying relay traffic for others and you
# have measured what it costs.
#
# Note the units are in the key names, and they do NOT match the internal field
# names: the file takes reservation_ttl_min (minutes) and
# connection_duration_sec (seconds). Writing reservation_ttl or
# connection_duration here is silently ignored.
#
# relay_limits:
#   max_reservations: 128            # concurrent reservations, server-wide
#   max_circuits: 16                 # concurrent circuits per reservation
#   buffer_size: 2048                # relay copy buffer, bytes
#   max_reservations_per_peer: 4
#   max_reservations_per_ip: 8
#   max_reservations_per_asn: 32
#   reservation_ttl_min: 60          # minutes
#   connection_duration_sec: 120     # seconds
#   connection_data: 131072          # bytes relayed per circuit before it is cut

# Admission control
#
# This is what governs throughput. It bounds how much work is in flight at
# once rather than how many requests a client may make per minute, so there is
# no ceiling in documents or requests per second to outgrow: work is admitted
# as fast as it can be completed. Throughput rises with the hardware and falls
# on its own when the database slows.
#
# It is also self-weighting. A batch write holds its slot for as long as it
# takes, so expensive work costs more capacity than cheap work without anyone
# having to maintain a cost model.
#
# A request that cannot be admitted within `acquire_timeout` is shed with a
# 503. That is a signal to add capacity -- a database connection, a replica, an
# instance -- not a verdict on the client.
admission_control:
  enabled: true

  # Concurrent requests server-wide. Omit or set 0 to derive it from
  # database.pool_size, which is the resource it protects.
  max_in_flight: 0

  # Concurrent requests from any single peer. This is what stops one client
  # occupying every slot, and it is why per-peer rate limiting can stay off.
  # Set 0 to remove the per-peer bound.
  max_in_flight_per_peer: 64

  # How long a request waits for a slot before being shed. Waiting is normal
  # and is how a fast client is paced to the database's actual speed.
  acquire_timeout: 5s

# Rate limiting (optional, off by default)
#
# Per-peer rate limits are NOT the throughput mechanism -- admission control
# above is. A rate limit is a constant somebody guessed: set it low and it caps
# a well-behaved client long before the hardware is busy; set it high and it
# protects nothing. It is also the wrong tool for overload, since a saturated
# server needs to shed whatever is arriving, not whatever a peer's budget says.
#
# They are here for the cases a capacity bound does not cover: per-tenant
# billing caps, untrusted peers, or containing a client known to be looping.
#
# Every limit is per peer. Each bucket has a sustained `rate` replenished over
# `window`, plus a `burst` a peer may accumulate while idle and spend at once.
# A `rate` of -1 disables the bucket, which is the default for all of them.
# A protocol name that is not recognised is a startup error rather than a
# silent no-op.
#
# When enabled, limits are counted per request: one BATCH_PUT costs the same as
# one PUT regardless of how many documents it carries.
#
# rate_limiting:
#   window: 1m
#   protocols:
#     msa:       { requests: { rate: 6000, burst: 12000 } }   # message submission
#     msa_batch: { requests: { rate: 600,  burst: 1200 } }    # batch submission, <=100 messages each
#     maa:       { requests: { rate: 6000, burst: 12000 } }   # message access
#     mma:       { requests: { rate: 600,  burst: 1200 } }    # mailbox administration
#     sda:                                                    # documents
#       read:  { rate: 6000, burst: 12000 }
#       write: { rate: 6000, burst: 12000 }
#     sfa:                                                    # feeds
#       read:  { rate: 6000, burst: 12000 }
#       write: { rate: 6000, burst: 12000 }
#     sca:                                                    # collections
#       read:  { rate: 6000, burst: 12000 }
#       write: { rate: 6000, burst: 12000 }
#     mta:       { requests: { rate: 60000, burst: 120000 } } # routing backstop, charged per message
#
# Legacy keys, still honoured. `window_minutes` is an alias for `window`;
# `max_requests_per_window` only ever fed the MTA backstop and still only does.
#
#   window_minutes: 1
#   max_requests_per_window: 60000

# Logging
#
# There is no logging section: the server logs at INFO, or at DEBUG when
# started with --development. At INFO every request is exactly one line,
# msg=request, with protocol, op, status, peer, duration and stream id; a
# refused request adds one WARN (client's fault) or ERROR (server's) naming
# the cause, on the same stream id. Everything a handler says about its own
# progress is DEBUG. A `logging:` block here is parsed by nobody and
# silently ignored, which is why it is not shown as a commented example --
# an ignored setting that looks configured is worse than an absent one.
#
# Library-level logging (DHT, relay, host) is controlled separately by the
# --debug-dht flag and by GOLOG_LOG_LEVEL.

# Peers this server trusts, by peer ID. Consulted by enable_authentication
# (who may connect) and enable_forwarding (who may forward).
security:
  trusted_peers: []
  #  - 12D3KooW...
