[program:ricochet]
; Command to run
command=/opt/ricochet/run.sh

; Working directory
directory=/var/lib/ricochet

; User to run as
user=ricochet

; Auto-start and restart settings
autostart=true
autorestart=true
startsecs=10
startretries=3

; Restart policy
; Restart if process exits with unexpected code
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Logging
stdout_logfile=/var/log/ricochet/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/ricochet/stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
redirect_stderr=false

; Process priority (lower number = higher priority)
priority=100

; Number of instances (usually 1 for stateful services)
numprocs=1
process_name=%(program_name)s

; Set environment variables
environment=HOME="/var/lib/ricochet"
